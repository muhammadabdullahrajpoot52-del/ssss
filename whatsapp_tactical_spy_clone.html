<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Tactical Spy & Hider</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.1);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.4);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen overflow-hidden font-sans">
  <div id="root"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // Firebase Config (Fallback to public demo mode if env is unconfigured)
    const firebaseConfig = typeof __firebase_config !== 'undefined' 
      ? JSON.parse(__firebase_config) 
      : {
          apiKey: "demo-api-key",
          authDomain: "whatsapp-spy-hider.firebaseapp.com",
          projectId: "whatsapp-spy-hider",
          storageBucket: "whatsapp-spy-hider.appspot.com",
          messagingSenderId: "1234567890",
          appId: "1:1234567890:web:demo"
        };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'whatsapp-spy-hider-app';

    window.FB = { auth, db, appId, signInAnonymously, onAuthStateChanged, collection, addDoc, onSnapshot, serverTimestamp, doc, setDoc };
  </script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const HIDDEN_EMOJI = "🙈";

    const ROLES = {
      hunter: { id: 'hunter', name: 'Hunter', pass: '11', badge: '🎯 HUNTER', color: 'bg-red-500 text-white', avatar: HIDDEN_EMOJI, desc: 'Hunt and track all active hiders and spies.' },
      spy: { id: 'spy', name: 'Spy', pass: '22', badge: '🕵️ SPY', color: 'bg-purple-600 text-white', avatar: HIDDEN_EMOJI, desc: 'Infiltrate encrypted communications.' },
      hider1: { id: 'hider1', name: 'Hider 1', pass: '33', badge: '🙈 HIDER 1', color: 'bg-emerald-600 text-white', avatar: HIDDEN_EMOJI, desc: 'Hide silently and coordinate team strategy.' },
      hider2: { id: 'hider2', name: 'Hider 2', pass: '44', badge: '🥷 HIDER 2', color: 'bg-blue-600 text-white', avatar: HIDDEN_EMOJI, desc: 'Evade detection until time runs out.' }
    };

    const THEMES = [
      { id: 'whatsapp-dark', name: 'WhatsApp Dark', bg: 'bg-[#0b141a]', header: 'bg-[#202c33]', sidebar: 'bg-[#111b21]', bubbleSelf: 'bg-[#005c4b]', bubbleOther: 'bg-[#202c33]', text: 'text-[#e9edef]', textSec: 'text-[#8696a0]', border: 'border-[#222d34]', accent: '#00a884' },
      { id: 'whatsapp-light', name: 'WhatsApp Light', bg: 'bg-[#efeae2]', header: 'bg-[#008069]', sidebar: 'bg-[#ffffff]', bubbleSelf: 'bg-[#d9fdd3]', bubbleOther: 'bg-[#ffffff]', text: 'text-[#111b21]', textSec: 'text-[#667781]', border: 'border-[#e9edef]', accent: '#008069' },
      { id: 'cyberpunk', name: 'Cyberpunk Neon', bg: 'bg-[#090a0f]', header: 'bg-[#121526]', sidebar: 'bg-[#0d0f1d]', bubbleSelf: 'bg-[#ff0055]', bubbleOther: 'bg-[#1a1e36]', text: 'text-[#00f0ff]', textSec: 'text-[#8b9bb4]', border: 'border-[#00f0ff]/30', accent: '#ff0055' },
      { id: 'ocean', name: 'Ocean Blue', bg: 'bg-[#0f172a]', header: 'bg-[#1e293b]', sidebar: 'bg-[#0f172a]', bubbleSelf: 'bg-[#0284c7]', bubbleOther: 'bg-[#334155]', text: 'text-[#f8fafc]', textSec: 'text-[#94a3b8]', border: 'border-[#334155]', accent: '#38bdf8' },
      { id: 'emerald', name: 'Forest Emerald', bg: 'bg-[#062016]', header: 'bg-[#0c3827]', sidebar: 'bg-[#08291d]', bubbleSelf: 'bg-[#059669]', bubbleOther: 'bg-[#114733]', text: 'text-[#ecfdf5]', textSec: 'text-[#6ee7b7]', border: 'border-[#114733]', accent: '#10b981' },
      { id: 'sunset', name: 'Sunset Amber', bg: 'bg-[#1a0c0c]', header: 'bg-[#2e1415]', sidebar: 'bg-[#210e0f]', bubbleSelf: 'bg-[#ea580c]', bubbleOther: 'bg-[#3d1e1f]', text: 'text-[#fff7ed]', textSec: 'text-[#fdba74]', border: 'border-[#3d1e1f]', accent: '#f97316' },
      { id: 'midnight', name: 'Midnight Purple', bg: 'bg-[#120b1f]', header: 'bg-[#211438]', sidebar: 'bg-[#180e2b]', bubbleSelf: 'bg-[#7c3aed]', bubbleOther: 'bg-[#2d1b4d]', text: 'text-[#f5f3ff]', textSec: 'text-[#c4b5fd]', border: 'border-[#2d1b4d]', accent: '#8b5cf6' },
      { id: 'rose', name: 'Rose Gold', bg: 'bg-[#1f0e14]', header: 'bg-[#381925]', sidebar: 'bg-[#29111b]', bubbleSelf: 'bg-[#e11d48]', bubbleOther: 'bg-[#4a2232]', text: 'text-[#fff1f2]', textSec: 'text-[#fecdd3]', border: 'border-[#4a2232]', accent: '#f43f5e' },
      { id: 'solar', name: 'Solar Light', bg: 'bg-[#fefce8]', header: 'bg-[#ca8a04]', sidebar: 'bg-[#fef9c3]', bubbleSelf: 'bg-[#fde047]', bubbleOther: 'bg-[#ffffff]', text: 'text-[#713f12]', textSec: 'text-[#a16207]', border: 'border-[#fef08a]', accent: '#ca8a04' },
      { id: 'matrix', name: 'Matrix Green', bg: 'bg-[#000000]', header: 'bg-[#051a05]', sidebar: 'bg-[#020d02]', bubbleSelf: 'bg-[#15803d]', bubbleOther: 'bg-[#0a2e0a]', text: 'text-[#22c55e]', textSec: 'text-[#15803d]', border: 'border-[#15803d]/40', accent: '#22c55e' }
    ];

    function App() {
      const [user, setUser] = useState(null);
      const [selectedRole, setSelectedRole] = useState('hunter');
      const [passwordInput, setPasswordInput] = useState('');
      const [passError, setPassError] = useState('');
      const [isLoggedIn, setIsLoggedIn] = useState(false);

      const [activeTheme, setActiveTheme] = useState(THEMES[0]);
      const [messages, setMessages] = useState([]);
      const [inputText, setInputText] = useState('');
      const [activeChannel, setActiveChannel] = useState('global');
      const [isListening, setIsListening] = useState(false);
      const [soundEnabled, setSoundEnabled] = useState(true);
      const [showThemePicker, setShowThemePicker] = useState(false);

      const messagesEndRef = useRef(null);
      const recognitionRef = useRef(null);
      const baseTextRef = useRef('');
      const prevMessagesCount = useRef(0);

      // Authenticate
      useEffect(() => {
        const checkFB = setInterval(() => {
          if (window.FB && window.FB.auth) {
            clearInterval(checkFB);
            window.FB.signInAnonymously(window.FB.auth).catch(console.error);
            window.FB.onAuthStateChanged(window.FB.auth, (u) => setUser(u));
          }
        }, 100);
        return () => clearInterval(checkFB);
      }, []);

      // Speech Recognition setup (Fixed for no repetitions)
      useEffect(() => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
          const recognition = new SpeechRecognition();
          recognition.continuous = true;
          recognition.interimResults = true;

          recognition.onresult = (event) => {
            let interim = '';
            let finalStr = '';

            for (let i = event.resultIndex; i < event.results.length; i++) {
              const transcript = event.results[i][0].transcript;
              if (event.results[i].isFinal) {
                finalStr += transcript + ' ';
              } else {
                interim += transcript;
              }
            }

            if (finalStr) {
              baseTextRef.current += (baseTextRef.current && !baseTextRef.current.endsWith(' ') ? ' ' : '') + finalStr;
            }

            const currentCombined = baseTextRef.current + interim;
            setInputText(currentCombined);
          };

          recognition.onerror = () => setIsListening(false);
          recognition.onend = () => setIsListening(false);

          recognitionRef.current = recognition;
        }
      }, []);

      const toggleListening = () => {
        if (!recognitionRef.current) {
          alert("Voice input is not supported in this browser.");
          return;
        }
        if (isListening) {
          recognitionRef.current.stop();
          setIsListening(false);
        } else {
          try {
            baseTextRef.current = inputText;
            recognitionRef.current.start();
            setIsListening(true);
          } catch (e) {
            setIsListening(false);
          }
        }
      };

      // Realtime Messages Sync
      useEffect(() => {
        if (!user || !isLoggedIn || !window.FB) return;

        const { db, appId, collection, onSnapshot } = window.FB;
        const messagesCol = collection(db, 'artifacts', appId, 'public', 'data', 'messages');

        const unsub = onSnapshot(messagesCol, (snapshot) => {
          const msgList = [];
          snapshot.forEach((docSnap) => {
            msgList.push({ id: docSnap.id, ...docSnap.data() });
          });

          msgList.sort((a, b) => {
            const timeA = a.createdAt?.toMillis ? a.createdAt.toMillis() : 0;
            const timeB = b.createdAt?.toMillis ? b.createdAt.toMillis() : 0;
            return timeA - timeB;
          });

          setMessages(msgList);

          if (soundEnabled && msgList.length > prevMessagesCount.current && prevMessagesCount.current > 0) {
            const lastMsg = msgList[msgList.length - 1];
            if (lastMsg.role !== selectedRole) {
              playBeep();
            }
          }
          prevMessagesCount.current = msgList.length;
        }, (err) => console.error("Snapshot error:", err));

        return () => unsub();
      }, [user, isLoggedIn, selectedRole, soundEnabled]);

      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages, activeChannel]);

      const playBeep = () => {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, ctx.currentTime);
          gain.gain.setValueAtTime(0.1, ctx.currentTime);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.15);
        } catch (e) {}
      };

      const handleLogin = (e) => {
        e?.preventDefault();
        const targetRole = ROLES[selectedRole];
        if (passwordInput === targetRole.pass) {
          setPassError('');
          setIsLoggedIn(true);
        } else {
          setPassError(`Incorrect password! Password for ${targetRole.name} is: "${targetRole.pass}"`);
        }
      };

      const autofillRole = (roleKey) => {
        setSelectedRole(roleKey);
        setPasswordInput(ROLES[roleKey].pass);
        setPassError('');
      };

      const sendMessage = async (e) => {
        e?.preventDefault();
        if (!inputText.trim() || !user || !window.FB) return;

        const currentRole = ROLES[selectedRole];
        const textToSend = inputText.trim();
        setInputText('');
        baseTextRef.current = '';

        try {
          const { db, appId, collection, addDoc, serverTimestamp } = window.FB;
          const messagesCol = collection(db, 'artifacts', appId, 'public', 'data', 'messages');
          await addDoc(messagesCol, {
            text: textToSend,
            role: selectedRole,
            roleBadge: currentRole.badge,
            roleColor: currentRole.color,
            channel: activeChannel,
            senderUid: user.uid,
            createdAt: serverTimestamp(),
            timeStr: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          });
        } catch (err) {
          console.error("Failed to send message:", err);
        }
      };

      const filteredMessages = messages.filter(msg => {
        if (msg.channel === 'global') return true;
        if (activeChannel === 'global') return true;
        return msg.channel === activeChannel;
      });

      if (!isLoggedIn) {
        return (
          <div className="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center p-4 select-none">
            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 sm:p-8 w-full max-w-md shadow-2xl">
              
              <div className="flex flex-col items-center mb-6 text-center">
                <div className="w-16 h-16 bg-emerald-500/20 text-4xl rounded-full flex items-center justify-center mb-2 ring-4 ring-emerald-500/10">
                  {HIDDEN_EMOJI}
                </div>
                <h1 className="text-2xl font-extrabold text-white">WhatsApp Tactical Spy</h1>
                <p className="text-xs text-slate-400 mt-1">Multi-Device Real-Time Game Network</p>
              </div>

              <div className="mb-6">
                <label className="text-xs font-bold text-slate-400 uppercase block mb-2">
                  ⚡ Auto-Fill Role & Passwords:
                </label>
                <div className="grid grid-cols-2 gap-2">
                  {Object.keys(ROLES).map((key) => {
                    const r = ROLES[key];
                    return (
                      <button
                        key={key}
                        type="button"
                        onClick={() => autofillRole(key)}
                        className={`p-3 rounded-xl border text-left flex items-center justify-between ${
                          selectedRole === key 
                            ? 'bg-emerald-500/20 border-emerald-500 text-white shadow ring-1 ring-emerald-500' 
                            : 'bg-slate-950 border-slate-800 text-slate-300 hover:bg-slate-800/50'
                        }`}
                      >
                        <div>
                          <div className="text-xs font-bold flex items-center gap-1">
                            <span className="text-base">{r.avatar}</span> {r.name}
                          </div>
                          <div className="text-[10px] text-slate-400">Pass: <span className="font-mono text-emerald-400 font-bold">{r.pass}</span></div>
                        </div>
                      </button>
                    );
                  })}
                </div>
              </div>

              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="block text-xs font-semibold text-slate-300 mb-1">
                    Selected Role:
                  </label>
                  <div className="p-3 bg-slate-950 rounded-xl border border-slate-800 text-sm font-bold flex items-center gap-3">
                    <span className="text-3xl">{ROLES[selectedRole].avatar}</span>
                    <div>
                      <div className="text-emerald-400">{ROLES[selectedRole].name}</div>
                      <div className="text-[11px] text-slate-400 font-normal">{ROLES[selectedRole].desc}</div>
                    </div>
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-300 mb-1">
                    Security Passcode:
                  </label>
                  <input
                    type="password"
                    value={passwordInput}
                    onChange={(e) => setPasswordInput(e.target.value)}
                    placeholder={`Enter Password (${ROLES[selectedRole].pass})`}
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl py-2.5 px-4 text-sm text-white focus:outline-none focus:border-emerald-500 font-mono"
                  />
                  {passError && (
                    <p className="text-xs text-red-400 mt-2 font-medium">{passError}</p>
                  )}
                </div>

                <button
                  type="submit"
                  className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl shadow-lg transition-all"
                >
                  Connect To Network
                </button>
              </form>

            </div>
          </div>
        );
      }

      const currentRoleObj = ROLES[selectedRole];

      return (
        <div className={`h-screen w-screen flex flex-col font-sans ${activeTheme.bg} transition-colors duration-200 overflow-hidden`}>
          <div className="flex-1 flex h-full max-w-[1600px] w-full mx-auto shadow-2xl relative">

            {/* SIDEBAR */}
            <div className={`w-80 sm:w-96 flex flex-col border-r ${activeTheme.sidebar} ${activeTheme.border} ${activeTheme.text}`}>
              
              <div className={`p-3 sm:p-4 flex items-center justify-between ${activeTheme.header} border-b ${activeTheme.border}`}>
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center text-2xl border border-slate-700">
                    {HIDDEN_EMOJI}
                  </div>
                  <div>
                    <h2 className="font-bold text-sm flex items-center gap-1.5">
                      {currentRoleObj.name}
                      <span className="text-[10px] px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-400 font-mono">ONLINE</span>
                    </h2>
                    <p className={`text-[11px] ${activeTheme.textSec}`}>{currentRoleObj.badge}</p>
                  </div>
                </div>

                <div className="flex items-center gap-1">
                  <button 
                    onClick={() => setSoundEnabled(!soundEnabled)} 
                    className={`p-2 rounded-full hover:bg-white/10 ${activeTheme.textSec}`}
                    title="Audio Alerts"
                  >
                    {soundEnabled ? "🔊" : "🔇"}
                  </button>

                  <button 
                    onClick={() => setShowThemePicker(!showThemePicker)} 
                    className={`p-2 rounded-full hover:bg-white/10 ${activeTheme.textSec}`}
                    title="10 Custom Themes"
                  >
                    🎨
                  </button>

                  <button 
                    onClick={() => setIsLoggedIn(false)} 
                    className={`p-2 rounded-full hover:bg-white/10 ${activeTheme.textSec}`}
                    title="Exit Role"
                  >
                    🚪
                  </button>
                </div>
              </div>

              {/* Theme Selector */}
              {showThemePicker && (
                <div className="p-3 border-b border-white/10 bg-slate-900 text-white">
                  <div className="text-xs font-bold mb-2 text-emerald-400">🎨 Choose 1 of 10 Themes:</div>
                  <div className="grid grid-cols-2 gap-1.5 max-h-48 overflow-y-auto">
                    {THEMES.map((t) => (
                      <button
                        key={t.id}
                        onClick={() => { setActiveTheme(t); setShowThemePicker(false); }}
                        className={`text-left text-xs p-2 rounded flex items-center justify-between ${
                          activeTheme.id === t.id ? 'bg-emerald-600 text-white font-bold' : 'bg-slate-800 text-slate-300'
                        }`}
                      >
                        <span>{t.name}</span>
                        <span className="w-3 h-3 rounded-full border border-white/20" style={{ backgroundColor: t.accent }}></span>
                      </button>
                    ))}
                  </div>
                </div>
              )}

              {/* Frequency Channel Buttons */}
              <div className="p-2 border-b border-white/5 bg-black/10">
                <div className="text-[11px] font-semibold text-slate-400 px-2 mb-1.5 uppercase">Frequencies</div>
                <div className="grid grid-cols-2 gap-1.5">
                  <button onClick={() => setActiveChannel('global')} className={`py-1.5 px-2 rounded text-xs font-semibold ${activeChannel === 'global' ? 'bg-emerald-600 text-white' : 'bg-slate-800/40 text-slate-300'}`}>🌐 Global</button>
                  <button onClick={() => setActiveChannel('hunter')} className={`py-1.5 px-2 rounded text-xs font-semibold ${activeChannel === 'hunter' ? 'bg-red-600 text-white' : 'bg-slate-800/40 text-slate-300'}`}>🎯 Hunter</button>
                  <button onClick={() => setActiveChannel('spy')} className={`py-1.5 px-2 rounded text-xs font-semibold ${activeChannel === 'spy' ? 'bg-purple-600 text-white' : 'bg-slate-800/40 text-slate-300'}`}>🕵️️ Spy</button>
                  <button onClick={() => setActiveChannel('hiders')} className={`py-1.5 px-2 rounded text-xs font-semibold ${activeChannel === 'hiders' ? 'bg-blue-600 text-white' : 'bg-slate-800/40 text-slate-300'}`}>🙈 Hiders</button>
                </div>
              </div>

              {/* Role List */}
              <div className="flex-1 overflow-y-auto p-3 space-y-2">
                <div className="text-[11px] font-semibold text-slate-400 uppercase mb-2">Role Access Codes</div>
                {Object.keys(ROLES).map((roleKey) => {
                  const r = ROLES[roleKey];
                  const isUserRole = selectedRole === roleKey;
                  return (
                    <div key={roleKey} className={`p-2.5 rounded-xl border flex items-center justify-between ${isUserRole ? 'bg-slate-800/80 border-emerald-500/50' : 'bg-slate-900/30 border-white/5'}`}>
                      <div className="flex items-center gap-2.5">
                        <div className="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center text-lg border border-slate-700">
                          {HIDDEN_EMOJI}
                        </div>
                        <div>
                          <div className="text-xs font-bold">{r.name}</div>
                          <div className="text-[10px] text-slate-400">{r.badge}</div>
                        </div>
                      </div>
                      <span className="text-[10px] px-2 py-0.5 rounded bg-slate-800 text-slate-300 font-mono">Pass: {r.pass}</span>
                    </div>
                  );
                })}
              </div>

            </div>

            {/* CHAT AREA */}
            <div className={`flex-1 flex flex-col ${activeTheme.bg} relative overflow-hidden`}>

              {/* Chat Header */}
              <div className={`p-3 sm:p-4 flex items-center justify-between ${activeTheme.header} border-b ${activeTheme.border}`}>
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center text-2xl border border-slate-700">
                    {HIDDEN_EMOJI}
                  </div>
                  <div>
                    <h3 className={`font-bold text-sm sm:text-base ${activeTheme.text} capitalize`}>
                      {activeChannel} Frequency
                    </h3>
                    <p className={`text-xs ${activeTheme.textSec}`}>Real-time phone multi-device active</p>
                  </div>
                </div>
              </div>

              {/* Messages Feed */}
              <div className="flex-1 overflow-y-auto p-4 sm:p-6 space-y-3">
                {filteredMessages.length === 0 ? (
                  <div className="h-full flex flex-col items-center justify-center text-center">
                    <div className="w-16 h-16 rounded-full bg-slate-800/50 flex items-center justify-center mb-3 text-3xl">
                      {HIDDEN_EMOJI}
                    </div>
                    <p className={`text-sm font-semibold ${activeTheme.text}`}>No messages yet</p>
                    <p className={`text-xs ${activeTheme.textSec} max-w-xs mt-1`}>
                      Type a message or use speech dictation below to send across all phones!
                    </p>
                  </div>
                ) : (
                  filteredMessages.map((msg) => {
                    const isMe = msg.role === selectedRole;
                    const roleConfig = ROLES[msg.role] || ROLES.hunter;

                    return (
                      <div key={msg.id} className={`flex flex-col ${isMe ? 'items-end' : 'items-start'} max-w-[85%] sm:max-w-[70%] ${isMe ? 'ml-auto' : 'mr-auto'}`}>
                        {!isMe && (
                          <div className="flex items-center gap-1.5 mb-1 px-1">
                            <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded ${roleConfig.color}`}>{msg.roleBadge || roleConfig.badge}</span>
                            <span className={`text-[10px] ${activeTheme.textSec}`}>{roleConfig.name}</span>
                          </div>
                        )}
                        <div className={`p-3 rounded-2xl relative shadow break-words max-w-full ${isMe ? `${activeTheme.bubbleSelf} ${activeTheme.text} rounded-tr-none` : `${activeTheme.bubbleOther} ${activeTheme.text} rounded-tl-none border ${activeTheme.border}`}`}>
                          <p className="text-sm leading-relaxed whitespace-pre-wrap">{msg.text}</p>
                          <div className={`flex items-center justify-end gap-1 mt-1 text-[10px] ${activeTheme.textSec} font-mono`}>
                            <span>{msg.timeStr || 'Just now'}</span>
                          </div>
                        </div>
                      </div>
                    );
                  })
                )}
                <div ref={messagesEndRef} />
              </div>

              {/* Speech Indicator */}
              {isListening && (
                <div className="bg-red-600 text-white px-4 py-2 text-xs font-semibold flex items-center justify-between animate-pulse">
                  <span>🎙️ Listening... Speak naturally now!</span>
                  <button onClick={toggleListening} className="underline text-[10px] font-bold">Stop</button>
                </div>
              )}

              {/* Message Input Form */}
              <div className={`p-3 sm:p-4 ${activeTheme.header} border-t ${activeTheme.border}`}>
                <form onSubmit={sendMessage} className="flex items-center gap-2">
                  <button 
                    type="button" 
                    onClick={toggleListening}
                    className={`p-2.5 rounded-full transition-all ${isListening ? 'bg-red-600 text-white animate-pulse' : `${activeTheme.textSec} hover:bg-white/5`}`}
                    title="Voice Dictation"
                  >
                    🎙️
                  </button>

                  <input
                    type="text"
                    value={inputText}
                    onChange={(e) => {
                      setInputText(e.target.value);
                      baseTextRef.current = e.target.value;
                    }}
                    placeholder={isListening ? "Listening..." : "Type message or use voice..."}
                    className={`flex-1 ${activeTheme.sidebar} ${activeTheme.text} rounded-full py-2.5 px-4 text-sm focus:outline-none border ${activeTheme.border}`}
                  />

                  <button
                    type="submit"
                    disabled={!inputText.trim()}
                    className="p-2.5 rounded-full bg-emerald-600 hover:bg-emerald-500 text-white disabled:opacity-40"
                  >
                    ➤
                  </button>
                </form>
              </div>

            </div>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
